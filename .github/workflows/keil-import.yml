name: keil-import

# 把单个 Keil 工程转成 CMake 并编译，验证转换脚本本身可用。
#
# 这是 CI 内部校验，不是给开发者用的转换工具：
#   * 转换脚本在 .github/scripts/keil2cmake.py（gen_all_cmake 的单工程入口）
#   * 产物只写到 build/keil-import/，不落回仓库
#   * 不改动 examples/ 下任何 Keil 工程文件
#
# 全量工程的编译验证在 build-all；这里只挑一个代表性工程做冒烟，
# 确认"单工程入口"这条路径没坏（它与批量入口共用 generate_one）。

on:
  workflow_dispatch:
  push:
    branches: ["**"]
  pull_request:

jobs:
  keil-import:
    name: ${{ matrix.chip }} / ${{ matrix.project }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - { chip: ing918, project: peripheral_ibeacon }
          # ING9188xx 与 ING9187xx 是两颗不同的 ROM，这条覆盖 series 解析
          - { chip: ing918, project: periodic_advertiser }

    steps:
      - uses: actions/checkout@v6

      - uses: ./.github/actions/setup-ing-env
        with:
          gcc: 'true'
          cmsis: cmsis4
          nim: 'true'

      - name: Generate bundle symbols
        run: |
          export PATH=~/nim/nim_x64/bin:$PATH
          cd tools
          nim -d:release c gen_files.nim
          ./gen_files "${{ github.workspace }}/bundles"

      - name: Convert Keil project to CMake
        run: |
          python .github/scripts/keil2cmake.py \
            --project examples/${{ matrix.project }}/${{ matrix.project }}.uvprojx \
            --chip ${{ matrix.chip }} \
            --out build/keil-import

      - name: Configure and build
        working-directory: build/keil-import/${{ matrix.project }}/${{ matrix.chip }}
        env:
          CMSIS_BASE: ${{ github.workspace }}/third_party/cmsis
        run: |
          set -o pipefail
          cmake -B build \
            --toolchain=../../../../cmake/toolchain-arm-none-eabi.cmake \
            -G Ninja \
            -DCHIP=${{ matrix.chip }} \
            -DARM_GCC_ROOT=/opt/arm-gcc 2>&1 | tee configure.log
          cmake --build build 2>&1 | tee build.log

      - name: Upload artifacts
        if: success()
        uses: actions/upload-artifact@v7
        with:
          name: keil-import-${{ matrix.chip }}-${{ matrix.project }}
          path: |
            build/keil-import/${{ matrix.project }}/${{ matrix.chip }}/build/**/*.elf
            build/keil-import/${{ matrix.project }}/${{ matrix.chip }}/CMakeLists.txt
            build/keil-import/${{ matrix.project }}/${{ matrix.chip }}/build.log
          if-no-files-found: warn
