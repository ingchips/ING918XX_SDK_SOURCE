name: keil-import

# 把 examples/ 下的 Keil 工程转成 CMake 并编译，验证"Keil 工程里的源码
# 在 GCC 下能否编过"。
#
# 这是 CI 内部校验，不是给开发者用的转换工具：
#   * 转换脚本在 .github/scripts/keil2cmake.py，只有这个 workflow 调用
#   * 产物只写到 build/keil-import/，不落回仓库
#   * 不改动 examples/ 下任何 Keil 工程文件

on:
  workflow_dispatch:
  push:
    branches: ["**"]
  pull_request:

env:
  ARM_GCC_VERSION: 13.3.rel1
  NIM_VERSION: 2.2.4

jobs:
  keil-import:
    name: ${{ matrix.chip }} / ${{ matrix.project }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - { chip: ing918, project: peripheral_ibeacon }

    steps:
      - uses: actions/checkout@v6

      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build xz-utils unzip
          cmake --version
          ninja --version

      - name: Cache Arm GNU Toolchain
        id: cache-gcc
        uses: actions/cache@v5
        with:
          path: /opt/arm-gcc
          key: arm-gcc-${{ env.ARM_GCC_VERSION }}

      - name: Install Arm GNU Toolchain
        if: steps.cache-gcc.outputs.cache-hit != 'true'
        run: |
          sudo mkdir -p /opt/arm-gcc
          wget -q https://developer.arm.com/-/media/Files/downloads/gnu/${{ env.ARM_GCC_VERSION }}/binrel/arm-gnu-toolchain-${{ env.ARM_GCC_VERSION }}-x86_64-arm-none-eabi.tar.xz -O /tmp/arm-gcc.tar.xz
          sudo tar -xJf /tmp/arm-gcc.tar.xz -C /opt/arm-gcc --strip-components=1
          /opt/arm-gcc/bin/arm-none-eabi-gcc --version


      - name: Cache Nim
        id: cache-nim
        uses: actions/cache@v5
        with:
          path: |
            ~/nim
            ~/.nimble
          key: nim-${{ env.NIM_VERSION }}-v2

      - name: Install Nim
        if: steps.cache-nim.outputs.cache-hit != 'true'
        run: |
          mkdir -p ~/nim
          wget -q https://nim-lang.org/download/nim-${{ env.NIM_VERSION }}-linux_x64.tar.xz -O /tmp/nim.tar.xz
          tar -xJf /tmp/nim.tar.xz -C ~/nim
          mv ~/nim/nim-${{ env.NIM_VERSION }} ~/nim/nim_x64
          export PATH=~/nim/nim_x64/bin:$PATH
          nimble refresh -y
          nimble install -y malebolgia

      - name: Generate bundle symbols
        run: |
          export PATH=~/nim/nim_x64/bin:$PATH
          cd tools
          nim -d:release c gen_files.nim
          ./gen_files "${{ github.workspace }}/bundles"

      - name: Convert Keil project to CMake
        run: |
          python .github/scripts/keil2cmake.py \
            --project examples/${{ matrix.project }}/${{ matrix.project }}.uvprojx \
            --chip ${{ matrix.chip }} \
            --out build/keil-import

      - name: Configure and build
        working-directory: build/keil-import/${{ matrix.project }}
        env:
          CMSIS_BASE: ${{ github.workspace }}/third_party/cmsis
        run: |
          set -o pipefail
          cmake -B build \
            --toolchain=../../../cmake/toolchain-arm-none-eabi.cmake \
            -G Ninja \
            -DCHIP=${{ matrix.chip }} \
            -DARM_GCC_ROOT=/opt/arm-gcc 2>&1 | tee configure.log
          cmake --build build 2>&1 | tee build.log

      - name: Upload artifacts
        if: success()
        uses: actions/upload-artifact@v7
        with:
          name: keil-import-${{ matrix.chip }}-${{ matrix.project }}
          path: |
            build/keil-import/${{ matrix.project }}/build/**/*.elf
            build/keil-import/${{ matrix.project }}/CMakeLists.txt
            build/keil-import/${{ matrix.project }}/build.log
          if-no-files-found: warn
