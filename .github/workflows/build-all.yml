name: build-all

# 全量工程编译验证：把 examples/ 下每个 Keil 工程按清单生成 CMake 工程并编译。
#
# 两条通道，共用同一份清单 `.github/project-matrix.yaml`：
#   gcc   —— Arm GNU Toolchain + CMSIS 4.30（仓库内，与 Keil4 同代）
#            C 标准取清单里的 c_standard（默认 gnu90，对齐 Keil4 的 uC99=0）
#   atfe  —— Arm Toolchain for Embedded 23.1.0 + CMSIS 6.1（下载）
#            C 标准强制 c99：CMSIS 6 的 cmsis_gcc.h 用了 C99 的循环内声明，
#            而 CMSIS 6 又是 ING916 FPU 代码能在 clang 下编译的前提
#
# 清单里声明的组合必须在两条通道上都编过；`skip: true` 的工程整体不测，
# `atfe_skip: true` 的工程只在 ATfE 通道跳过。
#
# bundles/ 里的 symdefs.* 不在版本库里（由 tools/gen_files 生成），
# 这里用 prepare job 生成一次、以 artifact 分发给各分片，避免每个分片
# 各自编译一遍 Nim。

on:
  workflow_dispatch:
  push:
    branches: ["**"]
  pull_request:

env:
  GROUPS_GCC: 12
  GROUPS_ATFE: 6

jobs:
  prepare:
    name: prepare bundles
    runs-on: ubuntu-24.04
    outputs:
      matrix_gcc: ${{ steps.matrix.outputs.gcc }}
      matrix_atfe: ${{ steps.matrix.outputs.atfe }}
    steps:
      - uses: actions/checkout@v6

      - uses: ./.github/actions/setup-ing-env
        with:
          gcc: 'false'
          cmsis: none
          nim: 'true'

      # 分片数只在 env.GROUPS_GCC / GROUPS_ATFE 定义一次，这里生成矩阵，
      # 两个 build job 用 fromJson 消费，不再各维护一份 group 列表
      - name: Build matrix
        id: matrix
        run: |
          gcc_n=${{ env.GROUPS_GCC }}
          atfe_n=${{ env.GROUPS_ATFE }}
          echo "gcc={\"group\":[$(seq -s, 0 $((gcc_n-1)))]}" >> "$GITHUB_OUTPUT"
          echo "atfe={\"group\":[$(seq -s, 0 $((atfe_n-1)))]}" >> "$GITHUB_OUTPUT"
          echo "gcc groups: $(seq -s, 0 $((gcc_n-1)))"
          echo "atfe groups: $(seq -s, 0 $((atfe_n-1)))"

      - name: Generate bundle symbols
        run: |
          export PATH=~/nim/nim_x64/bin:$PATH
          cd tools
          nim -d:release c gen_files.nim
          ./gen_files "${{ github.workspace }}/bundles"
          test -f "${{ github.workspace }}/bundles/typical/ING9187xx/symdefs.g"

      # 只分发 symdefs.*（1.9 MB），整个 bundles 有 78 MB
      - name: Stage symdefs
        run: |
          mkdir -p bundles-symdefs
          rsync -a --include='*/' --include='symdefs.*' --exclude='*' \
                bundles/ bundles-symdefs/
          find bundles-symdefs -name 'symdefs.*' | wc -l

      - uses: actions/upload-artifact@v7
        with:
          name: bundles-symdefs
          path: bundles-symdefs/
          retention-days: 1

  build-gcc:
    name: gcc / group-${{ matrix.group }}
    needs: prepare
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.prepare.outputs.matrix_gcc) }}
    steps:
      - uses: actions/checkout@v6

      - uses: ./.github/actions/setup-ing-env
        with:
          gcc: 'true'
          cmsis: cmsis4

      - uses: actions/download-artifact@v5
        with:
          name: bundles-symdefs
          path: bundles-symdefs

      - name: Restore symdefs
        run: rsync -a bundles-symdefs/ bundles/

      - name: Generate and probe this group
        env:
          CMSIS_BASE: ${{ github.workspace }}/third_party/cmsis
        run: |
          python tools/gen_all_cmake.py \
            --out build/gen \
            --probe \
            --config .github/project-matrix.yaml \
            --group ${{ matrix.group }} --groups ${{ env.GROUPS_GCC }} \
            --cmsis "$CMSIS_BASE" \
            --gcc-root /opt/arm-gcc \
            --c-standard gnu90

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: gcc-group-${{ matrix.group }}
          path: build/gen/manifest.json
          if-no-files-found: warn

  build-atfe:
    name: atfe / group-${{ matrix.group }}
    needs: prepare
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.prepare.outputs.matrix_atfe) }}
    steps:
      - uses: actions/checkout@v6

      - uses: ./.github/actions/setup-ing-env
        with:
          gcc: 'false'
          cmsis: cmsis6
          nim: 'false'

      - name: Cache ATfE
        id: cache-atfe
        uses: actions/cache@v5
        with:
          path: /opt/atfe
          key: atfe-23.1.0

      - name: Install ATfE
        if: steps.cache-atfe.outputs.cache-hit != 'true'
        run: |
          base=https://github.com/arm/arm-toolchain/releases/download/release-23.1.0-ATfE
          sudo mkdir -p /opt/atfe
          wget -q $base/ATfE-23.1.0-Linux-x86_64.tar.xz -O /tmp/atfe.tar.xz
          wget -q $base/ATfE-newlib-nano-overlay-23.1.0.tar.xz -O /tmp/atfe-nano.tar.xz
          sudo tar -xJf /tmp/atfe.tar.xz -C /opt/atfe --strip-components=1
          sudo tar -xJf /tmp/atfe-nano.tar.xz -C /opt/atfe
          test -f /opt/atfe/bin/newlib-nano.cfg
          /opt/atfe/bin/clang --version | head -1

      - uses: actions/download-artifact@v5
        with:
          name: bundles-symdefs
          path: bundles-symdefs

      - name: Restore symdefs
        run: rsync -a bundles-symdefs/ bundles/

      - name: Generate and probe this group
        env:
          CMSIS_BASE: ${{ github.workspace }}/cmsis/CMSIS_6-6.1.0/CMSIS/Core
        run: |
          python tools/gen_all_cmake.py \
            --out build/gen \
            --probe \
            --toolchain atfe \
            --config .github/project-matrix.yaml \
            --group ${{ matrix.group }} --groups ${{ env.GROUPS_ATFE }} \
            --cmsis "$CMSIS_BASE" \
            --atfe-root /opt/atfe \
            --force-c-standard c99

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: atfe-group-${{ matrix.group }}
          path: build/gen/manifest.json
          if-no-files-found: warn

  report:
    name: verify against the project matrix
    needs: [build-gcc, build-atfe]
    if: always()
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6

      - uses: actions/download-artifact@v5
        with:
          pattern: '*-group-*'
          path: groups

      - name: Summarize probe results
        run: |
          python .github/scripts/summarize_probe.py \
            --groups groups \
            --summary "$GITHUB_STEP_SUMMARY"
