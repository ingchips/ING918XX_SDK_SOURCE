name: build-matrix

# 编译验证矩阵：GCC 与 ATfE(LLVM) 双工具链 × 多 C 标准 × 多芯片。
# ing916 待迁移支持 916 的示例后再加入（get_started 不支持 916）。
# 目标是在合并前发现"改代码导致某个工具链或标准编不过"的问题。

on:
  workflow_dispatch:
  push:
    branches: ["**"]
  pull_request:

env:
  ARM_GCC_VERSION: 13.3.rel1
  ATFE_VERSION: 23.1.0
  CMSIS_VERSION: 6.1.0
  NIM_VERSION: 2.2.4
  ZIG_VERSION: 0.8.1

jobs:
  build:
    name: ${{ matrix.toolchain }} / ${{ matrix.chip }} / ${{ matrix.std }} / ${{ matrix.example }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - { toolchain: gcc,  toolchain_file: arm-none-eabi, chip: ing918, std: gnu11, example: get_started;peripheral_ibeacon }
          - { toolchain: gcc,  toolchain_file: arm-none-eabi, chip: ing918, std: gnu17, example: get_started;peripheral_ibeacon }
          - { toolchain: atfe, toolchain_file: atfe,          chip: ing918, std: gnu11, example: get_started;peripheral_ibeacon }
          - { toolchain: atfe, toolchain_file: atfe,          chip: ing918, std: gnu17, example: get_started;peripheral_ibeacon }
          - { toolchain: gcc,  toolchain_file: arm-none-eabi, chip: ing20,  std: gnu11, example: get_started }
          - { toolchain: atfe, toolchain_file: atfe,          chip: ing20,  std: gnu11, example: get_started }
          - { toolchain: gcc,  toolchain_file: arm-none-eabi, chip: ing916, std: gnu11, example: peripheral_console_realtime;peripheral_console_liteos }
          # CMSIS 6 用 __builtin_arm_set_fpscr 取代了 GCC 专有的 vfpcc clobber，
          # ING916 的 FPU 路径因此可以在 clang 下编译
          - { toolchain: atfe, toolchain_file: atfe,          chip: ing916, std: gnu11, example: peripheral_console_realtime }
          # 需要外部代码生成工具：zig 编 fota_client.zig，nim 生成业务 C 源码
          - { toolchain: gcc,  toolchain_file: arm-none-eabi, chip: ing918, std: gnu11, example: central_fota }
          - { toolchain: gcc,  toolchain_file: arm-none-eabi, chip: ing918, std: gnu11, example: smart_home_hub }

    steps:
      - uses: actions/checkout@v6

      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build xz-utils
          cmake --version
          ninja --version

      # ---------- 工具链：Arm GNU ----------
      - name: Cache Arm GNU Toolchain
        if: matrix.toolchain == 'gcc'
        id: cache-gcc
        uses: actions/cache@v5
        with:
          path: /opt/arm-gcc
          key: arm-gcc-${{ env.ARM_GCC_VERSION }}

      - name: Install Arm GNU Toolchain
        if: matrix.toolchain == 'gcc' && steps.cache-gcc.outputs.cache-hit != 'true'
        run: |
          sudo mkdir -p /opt/arm-gcc
          wget -q https://developer.arm.com/-/media/Files/downloads/gnu/${{ env.ARM_GCC_VERSION }}/binrel/arm-gnu-toolchain-${{ env.ARM_GCC_VERSION }}-x86_64-arm-none-eabi.tar.xz -O /tmp/arm-gcc.tar.xz
          sudo tar -xJf /tmp/arm-gcc.tar.xz -C /opt/arm-gcc --strip-components=1
          /opt/arm-gcc/bin/arm-none-eabi-gcc --version

      # ---------- 工具链：ATfE (LLVM) ----------
      - name: Cache ATfE
        if: matrix.toolchain == 'atfe'
        id: cache-atfe
        uses: actions/cache@v5
        with:
          path: /opt/atfe
          key: atfe-${{ env.ATFE_VERSION }}

      - name: Install ATfE + newlib-nano overlay
        if: matrix.toolchain == 'atfe' && steps.cache-atfe.outputs.cache-hit != 'true'
        run: |
          base=https://github.com/arm/arm-toolchain/releases/download/release-${{ env.ATFE_VERSION }}-ATfE
          wget -q $base/ATfE-${{ env.ATFE_VERSION }}-Linux-x86_64.tar.xz -O /tmp/atfe.tar.xz
          wget -q $base/ATfE-newlib-nano-overlay-${{ env.ATFE_VERSION }}.tar.xz -O /tmp/atfe-nano.tar.xz
          sudo mkdir -p /opt/atfe
          sudo tar -xJf /tmp/atfe.tar.xz -C /opt/atfe --strip-components=1
          # overlay 需叠加到主包之上，提供 bin/newlib-nano.cfg 与 lib/clang-runtimes/newlib-nano
          sudo tar -xJf /tmp/atfe-nano.tar.xz -C /opt/atfe
          test -f /opt/atfe/bin/newlib-nano.cfg
          /opt/atfe/bin/clang --version

      # ---------- CMSIS ----------
      - name: Cache CMSIS
        id: cache-cmsis
        uses: actions/cache@v5
        with:
          path: ${{ github.workspace }}/cmsis
          key: cmsis-${{ env.CMSIS_VERSION }}

      - name: Download CMSIS
        if: steps.cache-cmsis.outputs.cache-hit != 'true'
        run: |
          wget -q https://github.com/ARM-software/CMSIS_6/archive/refs/tags/v${{ env.CMSIS_VERSION }}.zip -O /tmp/cmsis.zip
          mkdir -p ${{ github.workspace }}/cmsis
          unzip -q /tmp/cmsis.zip -d ${{ github.workspace }}/cmsis

      # ---------- bundle 符号表 ----------
      # bundles/.gitignore 忽略了 symdefs.*，它们必须由 tools/gen_files 生成，
      # 否则链接时找不到 bundles/<bundle>/<series>/symdefs.g。
      - name: Cache Zig
        if: contains(matrix.example, 'central_fota')
        id: cache-zig
        uses: actions/cache@v5
        with:
          path: /usr/local/zig
          key: zig-${{ env.ZIG_VERSION }}

      - name: Install Zig
        if: contains(matrix.example, 'central_fota') && steps.cache-zig.outputs.cache-hit != 'true'
        run: |
          wget -q https://ziglang.org/download/${{ env.ZIG_VERSION }}/zig-linux-x86_64-${{ env.ZIG_VERSION }}.tar.xz -O /tmp/zig.tar.xz
          sudo tar -xJf /tmp/zig.tar.xz -C /usr/local/
          sudo mv /usr/local/zig-linux-x86_64-${{ env.ZIG_VERSION }} /usr/local/zig
          sudo ln -sf /usr/local/zig/zig /usr/local/bin/zig
          zig version

      - name: Cache Nim
        id: cache-nim
        uses: actions/cache@v5
        with:
          path: |
            ~/nim
            ~/.nimble
          key: nim-${{ env.NIM_VERSION }}-v2

      - name: Install Nim
        if: steps.cache-nim.outputs.cache-hit != 'true'
        run: |
          mkdir -p ~/nim
          wget -q https://nim-lang.org/download/nim-${{ env.NIM_VERSION }}-linux_x64.tar.xz -O /tmp/nim.tar.xz
          tar -xJf /tmp/nim.tar.xz -C ~/nim
          mv ~/nim/nim-${{ env.NIM_VERSION }} ~/nim/nim_x64
          export PATH=~/nim/nim_x64/bin:$PATH
          nimble refresh -y
          nimble install -y malebolgia

      - name: Generate bundle symbols
        run: |
          export PATH=~/nim/nim_x64/bin:$PATH
          cd tools
          nim -d:release c gen_files.nim
          ./gen_files "${{ github.workspace }}/bundles"
          test -f "${{ github.workspace }}/bundles/typical/ING9187xx/symdefs.g"
          test -f "${{ github.workspace }}/bundles/noos_mini/ING9168xx/symdefs.g"

      # ---------- 配置与构建 ----------
      - name: Configure
        env:
          CMSIS_BASE: ${{ github.workspace }}/cmsis/CMSIS_6-${{ env.CMSIS_VERSION }}/CMSIS/Core
          NIM_PATH: /home/runner/nim/nim_x64/bin
        run: |
          cmake -B build \
            --toolchain=cmake/toolchain-${{ matrix.toolchain_file }}.cmake \
            -G Ninja \
            -DCHIP=${{ matrix.chip }} \
            -DING_C_STANDARD=${{ matrix.std }} \
            -DING_EXAMPLES="${{ matrix.example }}" \
            -DARM_GCC_ROOT=/opt/arm-gcc \
            -DATFE_ROOT=/opt/atfe

      - name: Build
        shell: bash
        run: |
          set -o pipefail
          cmake --build build --verbose 2>&1 | tee build.log

      - name: Report size
        run: |
          echo "### ${{ matrix.toolchain }} / ${{ matrix.chip }} / ${{ matrix.std }} / ${{ matrix.example }}" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          find build -name '*.elf' -exec size {} \; 2>/dev/null || true
          find build -name '*.elf' -exec /opt/atfe/bin/llvm-size {} \; 2>/dev/null || true
          echo '```' >> $GITHUB_STEP_SUMMARY

      - name: Upload artifacts
        if: success()
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.toolchain }}-${{ matrix.chip }}-${{ matrix.std }}
          path: |
            build/**/*.elf
            build/**/*.bin
            build/**/*.map
            build.log
          if-no-files-found: warn
